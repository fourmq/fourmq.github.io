<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='115' fill='%233E1728'/%3E%3Ccircle cx='256' cy='150' r='42' fill='%23F2A0C0'/%3E%3Cpath d='M 75 320 C 130 210, 180 210, 230 280 S 310 400, 370 350 S 420 280, 430 260' fill='none' stroke='%23F2A0C0' stroke-width='32' stroke-linecap='round'/%3E%3C/svg%3E">
<title>Cantilena</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script>
window.addEventListener('error', function(event) {
  const errDiv = document.createElement('div');
  errDiv.style.cssText = 'position:fixed;inset:0;background:rgba(200,0,0,0.95);color:white;z-index:99999;padding:20px;font-family:monospace;font-size:14px;overflow:auto;white-space:pre-wrap;';
  errDiv.innerHTML = '<h2>Критическая ошибка JS</h2><p><b>Сообщение:</b> ' + event.message + '</p><p><b>Файл:</b> ' + event.filename + '</p><p><b>Строка:</b> ' + event.lineno + ':' + event.colno + '</p><p><b>Стек:</b><br>' + (event.error ? event.error.stack : 'Нет стека') + '</p><button onclick="this.parentElement.remove()" style="padding:10px 20px;margin-top:20px;font-size:16px;cursor:pointer;border:none;border-radius:8px;">Закрыть</button>';
  document.body.appendChild(errDiv);
});
</script>
</head>
<body>
<!-- ... заставка и сайдбар остаются без изменений ... -->
<div id="splash">
  <svg class="splash-svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="115" fill="#3E1728" /><path d="M 75 320 C 130 210, 180 210, 230 280 S 310 400, 370 350 S 420 280, 430 260" fill="none" stroke="#F2A0C0" stroke-width="32" stroke-linecap="round"/><circle r="22" fill="#F2A0C0" cx="0" cy="0"><animateMotion dur="2.6s" fill="freeze" begin="0.2s" path="M 75 320 C 130 210, 180 210, 230 280 S 310 400, 370 350 S 420 280, 430 260" /></circle></svg>
  <div class="splash-title">Cantilena</div>
</div>

<div class="app">
  <aside class="sidebar">...</aside> <!-- Оставляем как было -->
  <div class="main-area">
    <div class="topbar">...</div> <!-- Оставляем как было -->

    <main>
      <section id="screen-today" class="screen active">
        <!-- ... Кольца и дата ... -->
        <div class="card rings-card">...</div>
        
        <!-- ОБНОВЛЕННАЯ КАРТОЧКА ФОКУСА С ПОМОДОРО -->
        <div class="card focus-card" id="focus-card" style="display:none;">
          <div class="focus-label">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
            Фокус дня
          </div>
          <div class="focus-title" id="focus-title"></div>
          <div class="focus-meta" id="focus-meta"></div>
          
          <!-- Блок помодоро -->
          <div id="pomodoro-ui" style="margin-top:12px; display:flex; align-items:center; justify-content:space-between; background:var(--input-bg); padding:8px 12px; border-radius:8px;">
            <div id="pomo-time" style="font-size:20px; font-weight:700; font-variant-numeric:tabular-nums;">25:00</div>
            <button id="pomo-btn" onclick="togglePomodoro()" style="background:var(--accent); color:#fff; border:none; padding:6px 14px; border-radius:6px; font-weight:600; cursor:pointer;">Старт</button>
          </div>
        </div>

        <!-- ... Пульс, опрос, задачи, привычки ... -->
      </section>
      
      <!-- ... Остальные секции (Задачи, Заметки, Календарь, Статистика) оставляем как было ... -->
    </main>

    <!-- ... Нижнее меню, FAB, Шторка, Popover оставляем как было ... -->
  </div>
</div>
<div class="toast" id="toast"></div>

<!-- ПОДКЛЮЧАЕМ НАШ МОДУЛЬ -->
<script type="module" src="js/app.js"></script>
</body>
</html>
